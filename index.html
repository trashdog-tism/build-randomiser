<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0f16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Guardian Build Roulette</title>
<style>
/* Layout: wheel stage on the left (tabs → wheel → result), build sheet + pool editor on the right; stacks on phones. Deliberately dark-only. */
html,body{margin:0}
:root{
  --bg:#0c0f16;
  --panel:#141925;
  --panel-2:#1b2231;
  --line:#2a3346;
  --fg:#e7e9ee;
  --muted:#8d96a8;
  --gold:#ceae33;
  --gold-deep:#8e7520;
  --ink:#141005;
  --solar:#f0631e; --arc:#5bc7f2; --void:#b184c5; --stasis:#4d7dff; --strand:#35d36a; --prism:#e59ad0;
  --display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
*{box-sizing:border-box}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,34px);letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--gold)}
.tag{font-size:13px;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab small{font-family:var(--body);font-weight:500;letter-spacing:0;text-transform:none;font-size:12px;opacity:.8}
.tab[aria-selected="true"]{color:var(--ink);background:var(--gold);border-color:var(--gold)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.stage{display:flex;flex-direction:column;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 14px}
.filters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:32px}
.chip{background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:var(--body)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.wheel-box{position:relative;width:100%;max-width:440px;aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--fg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));z-index:2}
.readout{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);min-height:24px;text-align:center;letter-spacing:.03em}
.spin{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.14em;text-transform:uppercase;background:var(--gold);color:var(--ink);border:0;border-radius:4px;padding:13px 40px;cursor:pointer;box-shadow:0 0 0 1px var(--gold-deep) inset}
.spin:hover{filter:brightness(1.08)}
.spin:disabled{opacity:.55;cursor:wait}
.result{width:100%;border-top:1px solid var(--line);padding-top:14px;text-align:center;min-height:78px}
.result .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.result .name{font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,30px);color:var(--gold);line-height:1.15;margin-top:2px;text-wrap:balance}
.result .meta{font-size:14px;color:var(--muted)}
.result.empty .name{color:var(--muted);font-size:18px;font-weight:500}

aside{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.card h2{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;padding:9px 10px;background:var(--panel-2);border-radius:4px;border-left:3px solid var(--line)}
.slot.anchor{border-left-color:var(--gold)}
.slot .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.slot .v{font-weight:600;min-width:0;overflow-wrap:anywhere}
.slot .v small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.slot .v.none{color:var(--muted);font-weight:400}
.anchor-note{font-size:13px;color:var(--muted);margin:10px 0 0}
.anchor-note b{color:var(--gold);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:var(--body)}
.btn:hover{border-color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.hist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.hist li span:last-child{color:var(--muted);font-size:12px;white-space:nowrap}
.hist .emptyh{color:var(--muted)}

details summary{cursor:pointer;font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
details[open] summary{margin-bottom:10px}
.pool-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pool-tools input,.add input,.add select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-size:13.5px;font-family:var(--body);min-width:0}
.pool-tools input{flex:1 1 140px}
.pool-list{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:4px;padding:4px 8px;background:var(--bg)}
.pool-list label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13.5px;cursor:pointer}
.pool-list label.off span{color:var(--muted);text-decoration:line-through}
.pool-list .cls{margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pool-list .x{margin-left:6px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.add input{flex:1 1 150px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:8px 16px;border-radius:4px;font-weight:600;font-size:14px;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Guardian <span>Build Roulette</span></h1>
    <p class="tag">Pick a wheel. Spin it. Build around whatever lands.</p>
  </header>

  <div class="grid">
    <section>
      <div class="tabs" role="tablist" aria-label="Wheels">
        <button class="tab" role="tab" id="tab-sub" data-w="sub" aria-selected="true">Subclass<small>Class + element</small></button>
        <button class="tab" role="tab" id="tab-armor" data-w="armor" aria-selected="false">Exotic armor<small>Class exotic</small></button>
        <button class="tab" role="tab" id="tab-weapon" data-w="weapon" aria-selected="false">Exotic weapon<small>Any slot</small></button>
      </div>
      <div class="stage" style="margin-top:10px">
        <div class="filters" id="filters"></div>
        <div class="wheel-box">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" aria-label="Spinning wheel"></canvas>
        </div>
        <div class="readout" id="readout" aria-live="off"></div>
        <button class="spin" id="spin">Spin</button>
        <div class="result empty" id="result" aria-live="polite">
          <div class="eyebrow" id="r-eye">Result</div>
          <div class="name" id="r-name">Nothing rolled yet</div>
          <div class="meta" id="r-meta"></div>
        </div>
      </div>
    </section>

    <aside>
      <div class="card">
        <h2>Build sheet</h2>
        <div class="slots" id="slots"></div>
        <p class="anchor-note" id="anchor-note"></p>
        <div class="row">
          <button class="btn" id="copy">Copy build</button>
          <button class="btn" id="clear">Clear sheet</button>
        </div>
      </div>
      <div class="card">
        <details id="pool">
          <summary id="pool-sum">Edit pool</summary>
          <div class="pool-tools">
            <input id="pool-q" type="search" placeholder="Filter list…" aria-label="Filter pool">
            <button class="btn" id="all-on">All on</button>
            <button class="btn" id="all-off">All off</button>
          </div>
          <div class="pool-list" id="pool-list"></div>
          <div class="add">
            <input id="add-name" placeholder="Add an item (e.g. a new exotic)" aria-label="New item name">
            <select id="add-cls" aria-label="Class for new item"><option>Hunter</option><option>Titan</option><option>Warlock</option></select>
            <button class="btn" id="add-btn">Add</button>
          </div>
          <p class="note">Untick anything you don't own or never want to see. Changes stay in this browser.</p>
        </details>
      </div>
      <div class="card">
        <h2>Recent spins <button class="btn" id="hist-clear" style="font-size:11px;padding:3px 8px">Clear</button></h2>
        <ul class="hist" id="hist"></ul>
      </div>
    </aside>
  </div>
</div>

<script>
(function(){
const EL = {Solar:'--solar',Arc:'--arc',Void:'--void',Stasis:'--stasis',Strand:'--strand',Prismatic:'--prism'};
const SUBS = {
  Hunter:{Solar:'Gunslinger',Arc:'Arcstrider',Void:'Nightstalker',Stasis:'Revenant',Strand:'Threadrunner',Prismatic:'Prismatic'},
  Titan:{Solar:'Sunbreaker',Arc:'Striker',Void:'Sentinel',Stasis:'Behemoth',Strand:'Berserker',Prismatic:'Prismatic'},
  Warlock:{Solar:'Dawnblade',Arc:'Stormcaller',Void:'Voidwalker',Stasis:'Shadebinder',Strand:'Broodweaver',Prismatic:'Prismatic'}
};
const BASE = {sub:[],armor:[],weapon:[]};
for (const c in SUBS) for (const e in SUBS[c]) BASE.sub.push({name:c+' · '+SUBS[c][e], cls:c, el:e, short:SUBS[c][e]});

const ARMOR = {
Hunter:["Aeon Swift","Assassin's Cowl","Athrys's Embrace","Balance of Power","Blight Ranger","Bombardiers","Caliban's Hand","Celestial Nighthawk","Cyrtarachne's Facade","Foetracer","Fr0st-EE5","Gemini Jester","Graviton Forfeit","Gwisin Vest","Gyrfalcon's Hauberk","Knucklehead Radar","Liar's Handshake","Lucky Pants","Lucky Raspberry","Mask of Bakris","Mechaneer's Tricksleeves","Mothkeeper's Wraps","Oathkeeper","Omnioculus","Ophidia Spathe","Orpheus Rig","Radiant Dance Machines","Raiden Flux","Raiju's Harness","Relativism","Renewal Grasps","Sealed Ahamkara Grasps","Shards of Galanor","Shinobu's Vow","Speedloader Slacks","St0mp-EE5","Star-Eater Scales","The Dragon's Shadow","The Sixth Coyote","Triton Vice","Wormhusk Crown","Young Ahamkara's Spine"],
Titan:["Abeyant Leap","Actium War Rig","An Insurmountable Skullfort","Antaeus Wards","Armamentarium","Ashen Wake","Cadmus Ridge Lancecap","Citan's Ramparts","Crest of Alpha Lupi","Cuirass of the Falling Star","Doom Fang Pauldron","Dunemarchers","Eternal Warrior","Hallowfire Heart","Hazardous Propulsion","Heart of Inmost Light","Helm of Saint-14","Hoarfrost-Z","Icefall Mantle","Khepri's Horn","Lion Rampant","Loreley Splendor Helm","Mask of the Quiet One","Mk. 44 Stand Asides","No Backup Plans","One-Eyed Mask","Peacekeepers","Peregrine Greaves","Phoenix Cradle","Point-Contact Cannon Brace","Pyrogale Gauntlets","Second Chance","Severance Enclosure","Stoicism","Stronghold","Synthoceps","The Path of Burning Steps","Wishful Ignorance","Wormgod Caress"],
Warlock:["Aeon Soul","Apotheosis Veil","Astrocyte Verse","Ballidorse Wrathweavers","Boots of the Assembler","Briarbinds","Chromatic Fire","Claws of Ahamkara","Contraverse Hold","Crown of Tempests","Dawn Chorus","Eye of Another World","Fallen Sunstar","Felwinter's Helm","Geomag Stabilizers","Getaway Artist","Karnstein Armlets","Lunafaction Boots","Mantle of Battle Harmony","Mataiodoxía","Necrotic Grip","Nezarec's Sin","Ophidian Aspect","Osmiomancy Gloves","Phoenix Protocol","Promethium Spur","Rain of Fire","Sanguine Alchemy","Secant Filaments","Skull of Dire Ahamkara","Solipsism","Speaker's Sight","Starfire Protocol","Stormdancer's Brace","Sunbracers","Swarmers","The Stag","Transversive Steps","Verity's Brow","Vesper of Radius","Wings of Sacred Dawn","Winter's Guile"]
};
for (const c in ARMOR) ARMOR[c].forEach(n=>BASE.armor.push({name:n, cls:c}));

["Ace of Spades","Ager's Scepter","Anarchy","Arbalest","Bad Juju","Barrow-Dyad","Bastion","Black Talon","Borealis","Buried Bloodline","Centrifuse","Cerberus+1","Choir of One","Cloudstrike","Coldheart","Collective Obligation","Conditional Finality","Crimson","Cryosthesia 77K","Dead Man's Tale","Dead Messenger","Deathbringer","Delicate Tomb","Deterministic Chaos","Devil's Ruin","Divinity","Dragon's Breath","Duality","Edge of Action","Edge of Concurrence","Edge of Intent","Eriana's Vow","Euphony","Ex Diris","Eyes of Tomorrow","Fighting Lion","Final Warning","Forerunner","Gjallarhorn","Grand Overture","Graviton Lance","Hard Light","Hawkmoon","Heartshadow","Heir Apparent","Hierarchy of Needs","Izanagi's Burden","Jötunn","Khvostov 7G-0X","Le Monarque","Legend of Acrius","Leviathan's Breath","Lord of Wolves","Lorentz Driver","Lumina","Malfeasance","Merciless","Microcosm","MIDA Multi-Tool","Monte Carlo","Necrochasm","One Thousand Voices","Osteo Striga","Outbreak Perfected","Parasite","Polaris Lance","Prometheus Lens","Quicksilver Storm","Rat King","Red Death Reformed","Revision Zero","Riskrunner","Ruinous Effigy","Salvation's Grip","Skyburner's Oath","Sleeper Simulant","Slayer's Fang","Still Hunt","Sturm","SUROS Regime","Sunshot","Sweet Business","Symmetry","Tarrabah","Telesto","Tessellation","The Chaperone","The Colony","The Fourth Horseman","The Huckleberry","The Jade Rabbit","The Lament","The Last Word","The Manticore","The Navigator","The Prospector","The Queenbreaker","The Wardcliff Coil","Thorn","Thunderlord","Ticuu's Divination","Tommy's Matchbook","Tractor Cannon","Traveler's Chosen","Trinity Ghoul","Truth","Two-Tailed Fox","Touch of Malice","Verglas Curve","Vex Mythoclast","Vexcalibur","Vigilance Wing","Wavesplitter","Whisper of the Worm","Wicked Implement","Winterbite","Wish-Ender","Wish-Keeper","Witherhoard","Worldline Zero","Xenophage"]
  .filter(Boolean).forEach(n=>BASE.weapon.push({name:n}));

const LABEL = {sub:'Subclass',armor:'Exotic armor',weapon:'Exotic weapon'};
const KEY='gbr-v1';
let S = {wheel:'sub', armorCls:'match', off:[], custom:{sub:[],armor:[],weapon:[]}, build:{sub:null,armor:null,weapon:null}, anchor:null, hist:[]};
try{ const raw=localStorage.getItem(KEY); if(raw){ const p=JSON.parse(raw); S=Object.assign(S,p); S.custom=Object.assign({sub:[],armor:[],weapon:[]},p.custom||{}); S.build=Object.assign({sub:null,armor:null,weapon:null},p.build||{}); } }catch(e){}
let off = new Set(S.off);
function save(){ S.off=[...off]; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const $=id=>document.getElementById(id);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const k=(w,it)=>w+'|'+(it.cls||'')+'|'+it.name;
const all=w=>BASE[w].concat(S.custom[w].map(x=>Object.assign({custom:true},x)));

function armorClass(){
  if (S.armorCls==='match') return S.build.sub ? S.build.sub.cls : null;
  if (S.armorCls==='any') return null;
  return S.armorCls;
}
function active(w){
  let items = all(w).filter(it=>!off.has(k(w,it)));
  if (w==='armor'){ const c=armorClass(); if(c) items=items.filter(it=>it.cls===c); }
  return items;
}

/* ---------- wheel drawing ---------- */
const cv=$('wheel'), ctx=cv.getContext('2d');
let rot=0, spinning=false, size=0;
function fit(){
  const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1;
  size=r.width; cv.width=Math.round(r.width*d); cv.height=Math.round(r.width*d);
  ctx.setTransform(d,0,0,d,0,0); draw();
}
function sliceColor(w,it,i){
  if (w==='sub') return css(EL[it.el]);
  if (w==='armor') return i%2 ? css('--gold-deep') : css('--gold');
  const pal=['#ceae33','#2b3447','#a68a28','#1f2636'];
  return pal[i%4];
}
function textOn(hex){
  const h=hex.replace('#',''); const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  const r=n>>16&255,g=n>>8&255,b=n&255; return (0.299*r+0.587*g+0.114*b)>140 ? '#141005' : '#eef0f4';
}
function draw(){
  const items=active(S.wheel), n=items.length, c=size/2, R=c-6;
  ctx.clearRect(0,0,size,size);
  ctx.beginPath(); ctx.arc(c,c,R+4,0,Math.PI*2); ctx.fillStyle=css('--line'); ctx.fill();
  if(!n){ ctx.fillStyle=css('--muted'); ctx.font='500 15px '+css('--body'); ctx.textAlign='center'; ctx.fillText('Pool is empty',c,c); return; }
  const s=Math.PI*2/n, showLabels = s*R >= 12;
  for(let i=0;i<n;i++){
    const a0=rot+i*s-Math.PI/2, col=sliceColor(S.wheel,items[i],i);
    ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,R,a0,a0+s); ctx.closePath();
    ctx.fillStyle=col; ctx.fill();
    if(n<=60){ ctx.strokeStyle='rgba(12,15,22,.55)'; ctx.lineWidth=1; ctx.stroke(); }
    if(showLabels){
      ctx.save(); ctx.translate(c,c); ctx.rotate(a0+s/2);
      const label = S.wheel==='sub' ? items[i].cls+' · '+items[i].short : items[i].name;
      let f=Math.min(15, Math.max(8, s*R*0.55)); const maxL=R*0.66;
      ctx.font='600 '+f+'px '+css('--display');
      while(ctx.measureText(label).width>maxL && f>8){ f-=0.5; ctx.font='600 '+f+'px '+css('--display'); }
      let t=label; if(ctx.measureText(t).width>maxL){ while(t.length>3 && ctx.measureText(t+'…').width>maxL) t=t.slice(0,-1); t+='…'; }
      ctx.fillStyle=textOn(col); ctx.textAlign='right'; ctx.textBaseline='middle';
      ctx.fillText(t,R-10,0); ctx.restore();
    }
  }
  const hub=R*0.2;
  ctx.beginPath(); ctx.arc(c,c,hub,0,Math.PI*2); ctx.fillStyle=css('--bg'); ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=css('--gold'); ctx.stroke();
  ctx.fillStyle=css('--fg'); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='700 '+Math.round(hub*0.55)+'px '+css('--display'); ctx.fillText(n,c,c-hub*0.12);
  ctx.fillStyle=css('--muted'); ctx.font='500 '+Math.max(9,Math.round(hub*0.22))+'px '+css('--body'); ctx.fillText('in pool',c,c+hub*0.38);
}
function idxAt(n){ const s=Math.PI*2/n; let a=(-rot)%(Math.PI*2); if(a<0)a+=Math.PI*2; return Math.floor(a/s)%n; }
function readout(){
  const items=active(S.wheel); if(!items.length){ $('readout').textContent=''; return; }
  const it=items[idxAt(items.length)];
  $('readout').textContent = it.name;
}

/* ---------- spin ---------- */
function rand(n){ try{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; }catch(e){ return Math.floor(Math.random()*n); } }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function spin(){
  if(spinning) return;
  const items=active(S.wheel), n=items.length;
  if(n<1){ toast('Add or tick at least one item first'); return; }
  const idx=rand(n), s=Math.PI*2/n, j=0.15+Math.random()*0.7;
  const target=-(idx+j)*s, TAU=Math.PI*2;
  let end = target + Math.ceil((rot - target)/TAU)*TAU;  // >= rot
  end -= TAU*(reduce?1:6+rand(3));                      // spin direction: negative rotation = clockwise visual
  // ensure rot decreases → wheel turns; keep end < rot
  const start=rot, dur=reduce?700:4600, t0=performance.now();
  spinning=true; $('spin').disabled=true;
  const wheelAt=S.wheel;
  function frame(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,4);
    rot=start+(end-start)*e; draw(); readout();
    if(p<1) requestAnimationFrame(frame);
    else { rot=end%TAU; spinning=false; $('spin').disabled=false; land(wheelAt, items[idx]); }
  }
  requestAnimationFrame(frame);
}
function metaFor(w,it){
  if(w==='sub') return it.el+' · '+it.cls;
  if(w==='armor') return it.cls+' exotic';
  return 'Exotic weapon';
}
function land(w,it){
  S.build[w]={name:it.name, cls:it.cls||null, el:it.el||null, short:it.short||null};
  S.anchor=w;
  S.hist.unshift({w, name:it.name, t:Date.now()}); S.hist=S.hist.slice(0,10);
  save(); showResult(); renderSheet(); renderHist();
  if(w==='sub' && S.armorCls==='match') renderFilters();
}
function showResult(){
  const b=S.build[S.wheel], box=$('result');
  $('r-eye').textContent=LABEL[S.wheel];
  if(!b){ box.classList.add('empty'); $('r-name').textContent='Nothing rolled yet'; $('r-meta').textContent='Hit Spin to roll this wheel'; return; }
  box.classList.remove('empty');
  $('r-name').textContent = S.wheel==='sub' ? b.cls+' '+b.short : b.name;
  $('r-meta').textContent = metaFor(S.wheel,b);
}

/* ---------- UI ---------- */
function renderTabs(){ document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.w===S.wheel)); }
function renderFilters(){
  const f=$('filters'); f.innerHTML='';
  if(S.wheel!=='armor'){
    const p=document.createElement('span'); p.className='tag';
    p.textContent = S.wheel==='sub' ? '3 classes × 6 subclasses' : 'Every slot, every class';
    f.appendChild(p); return;
  }
  const subCls = S.build.sub ? S.build.sub.cls : null;
  const opts=[['match', subCls ? 'Match subclass ('+subCls+')' : 'Match subclass roll'],['any','Any class'],['Hunter','Hunter'],['Titan','Titan'],['Warlock','Warlock']];
  opts.forEach(([v,l])=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=l; b.setAttribute('aria-pressed', S.armorCls===v);
    b.onclick=()=>{ if(spinning)return; S.armorCls=v; save(); renderFilters(); draw(); readout(); renderPool(); }; f.appendChild(b); });
}
function renderSheet(){
  const el=$('slots'); el.innerHTML='';
  ['sub','armor','weapon'].forEach(w=>{
    const b=S.build[w], d=document.createElement('div'); d.className='slot'+(S.anchor===w?' anchor':'');
    const v = b ? (w==='sub' ? b.cls+' '+b.short+'<small>'+b.el+'</small>' : esc(b.name)+(b.cls?'<small>'+b.cls+'</small>':'')) : 'Not rolled';
    d.innerHTML='<div class="k">'+LABEL[w]+'</div><div class="v'+(b?'':' none')+'">'+v+'</div>';
    el.appendChild(d);
  });
  const a=S.anchor && S.build[S.anchor];
  $('anchor-note').innerHTML = a ? 'Build around <b>'+esc(S.anchor==='sub'?a.cls+' '+a.short:a.name)+'</b>. Fill the other slots however you like, or spin them too.' : 'Spin any wheel. The latest roll becomes the build’s anchor.';
}
function renderHist(){
  const ul=$('hist'); ul.innerHTML='';
  if(!S.hist.length){ ul.innerHTML='<li class="emptyh">No spins yet</li>'; return; }
  S.hist.forEach(h=>{ const li=document.createElement('li');
    li.innerHTML='<span>'+esc(h.name)+'</span><span>'+LABEL[h.w]+'</span>'; ul.appendChild(li); });
}
function renderPool(){
  const w=S.wheel, q=$('pool-q').value.trim().toLowerCase();
  const list=all(w); const on=list.filter(it=>!off.has(k(w,it))).length;
  $('pool-sum').textContent='Edit '+LABEL[w].toLowerCase()+' pool ('+on+'/'+list.length+' on)';
  $('add-cls').hidden = w!=='armor';
  const box=$('pool-list'); box.innerHTML='';
  list.filter(it=>!q || it.name.toLowerCase().includes(q))
      .sort((a,b)=>(a.cls||'').localeCompare(b.cls||'')||a.name.localeCompare(b.name))
      .forEach(it=>{
    const id='p'+Math.random().toString(36).slice(2,9), key=k(w,it), isOn=!off.has(key);
    const lab=document.createElement('label'); lab.className=isOn?'':'off';
    lab.innerHTML='<input type="checkbox" '+(isOn?'checked':'')+'><span>'+esc(it.name)+'</span>'+(it.cls?'<span class="cls">'+it.cls+'</span>':'');
    lab.querySelector('input').onchange=e=>{ if(e.target.checked) off.delete(key); else off.add(key); save(); lab.className=e.target.checked?'':'off'; draw(); readout(); renderPoolSum(); };
    if(it.custom){ const x=document.createElement('button'); x.className='x'; x.title='Remove'; x.setAttribute('aria-label','Remove '+it.name); x.textContent='✕';
      x.onclick=ev=>{ ev.preventDefault(); S.custom[w]=S.custom[w].filter(c=>!(c.name===it.name&&(c.cls||'')===(it.cls||''))); off.delete(key); save(); renderPool(); draw(); readout(); };
      lab.appendChild(x); }
    box.appendChild(lab);
  });
}
function renderPoolSum(){ const w=S.wheel,list=all(w),on=list.filter(it=>!off.has(k(w,it))).length; $('pool-sum').textContent='Edit '+LABEL[w].toLowerCase()+' pool ('+on+'/'+list.length+' on)'; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let tt; function toast(m){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);} t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1800); }

function setWheel(w){ if(spinning) return; S.wheel=w; save(); renderTabs(); renderFilters(); draw(); readout(); showResult(); renderPool(); }
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setWheel(t.dataset.w));
$('spin').onclick=spin;
$('pool-q').oninput=renderPool;
$('all-on').onclick=()=>{ all(S.wheel).forEach(it=>off.delete(k(S.wheel,it))); save(); renderPool(); draw(); readout(); };
$('all-off').onclick=()=>{ all(S.wheel).forEach(it=>off.add(k(S.wheel,it))); save(); renderPool(); draw(); readout(); };
$('add-btn').onclick=addItem;
$('add-name').onkeydown=e=>{ if(e.key==='Enter') addItem(); };
function addItem(){
  const name=$('add-name').value.trim(); if(!name) return;
  const w=S.wheel;
  if(w==='sub'){ toast('Subclass wheel is fixed — use the tick boxes'); return; }
  const it={name}; if(w==='armor') it.cls=$('add-cls').value;
  if(all(w).some(x=>x.name.toLowerCase()===name.toLowerCase() && (x.cls||'')===(it.cls||''))){ toast('Already in the pool'); return; }
  S.custom[w].push(it); $('add-name').value=''; save(); renderPool(); draw(); readout(); toast('Added '+name);
}
$('clear').onclick=()=>{ S.build={sub:null,armor:null,weapon:null}; S.anchor=null; save(); renderSheet(); showResult(); renderFilters(); draw(); readout(); };
$('hist-clear').onclick=()=>{ S.hist=[]; save(); renderHist(); };
$('copy').onclick=()=>{
  const b=S.build;
  const txt=['Subclass: '+(b.sub?b.sub.cls+' '+b.sub.short:'—'),'Exotic armor: '+(b.armor?b.armor.name:'—'),'Exotic weapon: '+(b.weapon?b.weapon.name:'—')].join(' | ');
  const done=()=>toast('Build copied');
  try{ navigator.clipboard.writeText(txt).then(done,()=>fallback(txt)); }catch(e){ fallback(txt); }
};
function fallback(txt){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast('Build copied');}catch(e){toast('Select and copy: '+txt);} ta.remove(); }

window.addEventListener('resize',fit);
document.fonts && document.fonts.ready.then(draw);
renderTabs(); renderFilters(); fit(); readout(); showResult(); renderSheet(); renderHist(); renderPool();
})();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
